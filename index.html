<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2563eb">
  <title>liftlog</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <h1>liftlog</h1>
  <nav>
    <a href="index.html" class="active">Log</a>
    <a href="charts.html">Charts</a>
  </nav>

  <section id="setup" class="card hidden">
    <h2>Setup</h2>
    <p class="muted">Paste a GitHub fine-grained PAT with <strong>Contents: read &amp; write</strong> on this repo. Stored in this browser only.</p>
    <p class="muted"><a id="setup-link" target="_blank" rel="noopener">Open GitHub token settings →</a></p>
    <div class="field">
      <label for="token-input">Token</label>
      <input id="token-input" type="password" autocomplete="off" placeholder="github_pat_...">
    </div>
    <button id="save-token">Save token</button>
    <div id="setup-status" class="status"></div>
  </section>

  <section id="app" class="hidden">

    <div id="resume-banner" class="banner hidden">
      <span id="resume-text"></span>
      <button class="secondary" id="discard-draft">Discard</button>
    </div>

    <div class="card">
      <h2>Weight</h2>
      <div class="field">
        <label for="weight-date">Date</label>
        <input id="weight-date" type="date">
      </div>
      <div class="field">
        <label for="weight-value">Weight (kg)</label>
        <input id="weight-value" type="number" inputmode="decimal" step="0.1" min="0" placeholder="82.4">
      </div>
      <button id="log-weight">Log weight</button>
      <div id="weight-status" class="status"></div>
    </div>

    <div class="card">
      <h2>Workout</h2>
      <div class="field">
        <label for="workout-date">Date</label>
        <input id="workout-date" type="date">
      </div>
      <div class="field">
        <label for="workout-mode">Start</label>
        <select id="workout-mode">
          <option value="">— choose —</option>
        </select>
      </div>

      <div id="workout-body"></div>

      <div id="log-workout-wrap" class="hidden" style="margin-top: 16px;">
        <button id="log-workout">Log workout</button>
      </div>
      <div id="workout-status" class="status"></div>
    </div>

    <div class="card">
      <h2>Templates</h2>
      <div id="templates-list" class="entries"></div>
      <button class="secondary" id="manage-templates-btn" style="margin-top: 12px;">+ New template</button>
      <div id="new-template-form" class="field hidden stack" style="margin-top: 12px;">
        <input id="new-template-name" type="text" placeholder="Template name (e.g. Push B)">
        <label>Exercises (in order — tap to add)</label>
        <div id="new-template-picked" class="entries muted"><em>none yet</em></div>
        <select id="new-template-exercise-picker"></select>
        <div class="row">
          <button class="secondary" id="add-exercise-to-template">+ Add exercise</button>
        </div>
        <div class="row" style="margin-top: 8px;">
          <button id="save-template">Save template</button>
          <button class="secondary" id="cancel-template">Cancel</button>
        </div>
        <div id="new-template-status" class="status"></div>
      </div>
    </div>

    <div class="card">
      <h2>Exercises</h2>
      <button class="secondary" id="add-exercise-btn">+ Add new exercise</button>
      <div id="add-exercise-form" class="field hidden stack" style="margin-top: 12px;">
        <input id="new-exercise-name" type="text" placeholder="e.g. Romanian Deadlift">
        <div class="row">
          <button id="confirm-add-exercise">Add</button>
          <button class="secondary" id="cancel-add-exercise">Cancel</button>
        </div>
        <div id="add-exercise-status" class="status"></div>
      </div>
    </div>

    <div class="card">
      <h2>Settings</h2>
      <button class="danger" id="reset-token">Reset token</button>
    </div>

  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
